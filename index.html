<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Page</title>
    <style>
        :root {
            --primary-color: #333333;
            --background-color: #f4f7f6;
            --card-background: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--primary-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #111;
        }

        p {
            color: #666;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>Welcome to My Website</h1>
        <p>This is a small, clean HTML code example.</p>
        <img src="{{ url_for('static', filename='image/image.png') }}" alt="Sample Image">
    </main>

</body>
</html>
